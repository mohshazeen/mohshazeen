<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Shazeen — Full-Stack Software Engineer</title>
  <desc id="desc">A dark navy and blue gradient banner with subtle connected-node patterns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f1e"/>
      <stop offset="55%" stop-color="#101c35"/>
      <stop offset="100%" stop-color="#123a55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#9ac5e8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.23" stroke-width="1.5">
    <path d="M835 0 L930 68 L1045 36 L1140 105 L1200 74"/>
    <path d="M870 150 L960 105 L1050 156 L1137 132 L1200 174"/>
    <path d="M920 280 L960 212 L1070 236 L1148 194 L1200 220"/>
    <path d="M1045 36 L1050 156 L1070 236"/>
    <path d="M930 68 L960 105 L960 212"/>
  </g>
  <g fill="#67e8f9" fill-opacity="0.72">
    <circle cx="930" cy="68" r="3.5"/><circle cx="1045" cy="36" r="4"/><circle cx="1140" cy="105" r="3"/>
    <circle cx="960" cy="105" r="4"/><circle cx="1050" cy="156" r="3.5"/><circle cx="1137" cy="132" r="3"/>
    <circle cx="960" cy="212" r="3.5"/><circle cx="1070" cy="236" r="4"/><circle cx="1148" cy="194" r="3"/>
  </g>
  <rect x="66" y="56" width="5" height="168" rx="2.5" fill="url(#accent)"/>
  <text x="94" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="1.2">MOHAMED SHAZEEN</text>
